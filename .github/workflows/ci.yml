# lint / format のチェック。PR は base がどのブランチでも走らせる（#6 のようなスタックした PR も対象）
# error は失敗、warning は Actions の annotation に出すだけ。直す側は pre-push の自動修正（lefthook.yml）。
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: TypeScript (prettier / eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # 版は package.json の packageManager
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: prettier
        run: pnpm format:check
      - name: eslint
        # error があれば失敗。warning は annotation として表示（eslint-formatter-gha）
        run: pnpm --filter @vvlog/desktop exec eslint . --format gha
