# lint / format のチェック。PR は base がどのブランチでも走らせる（#6 のようなスタックした PR も対象）
# error は失敗、warning は Actions の annotation に出すだけ。直す側は pre-push の自動修正（lefthook.yml）。
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: TypeScript (prettier / eslint)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # 版は package.json の packageManager
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: prettier
        run: pnpm format:check
      - name: eslint
        # error があれば失敗。warning は annotation として表示（eslint-formatter-gha）
        run: pnpm --filter @vvlog/desktop exec eslint . --format gha

  rust:
    name: Rust (rustfmt / clippy)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Tauri のシステム依存
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config
      - name: rustfmt
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check
      - name: frontendDist のダミー（tauri の build.rs が dist の存在を見る）
        run: mkdir -p apps/desktop/dist
      - name: clippy
        working-directory: apps/desktop/src-tauri
        # error（deny な lint・コンパイルエラー）は失敗。warning は annotation に変換して通す
        run: |
          set -o pipefail
          cargo clippy --all-targets --message-format short 2>&1 | tee clippy.log
          awk -F': ' '/^[^ ]+:[0-9]+:[0-9]+: warning/ { split($1, p, ":"); msg = $0; sub(/^[^ ]+ warning: /, "", msg); printf "::warning file=apps/desktop/src-tauri/%s,line=%s::%s\n", p[1], p[2], msg }' clippy.log
