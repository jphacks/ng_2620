# GitHub Pages へ画面（SPA）を公開する。ローカルサーバーが配信するものと同じビルド（制限モードで動く。ADR-0015）
# 相対パスでビルドしてあるので、/<リポジトリ名>/ の下でもそのまま動く
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # 版は package.json の packageManager
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: build（型チェック + vite build）
        run: pnpm --filter @vvlog/desktop build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/desktop/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
