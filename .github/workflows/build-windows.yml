# Windows の配布物(インストーラー .exe とポータブル zip)をビルドする(#34 #41)。
# CUDA も GPU も要らない(薄い配布物: uv・ffmpeg・サーバー/pipeline のコード・画面・ランチャーだけ。ADR-0015)。
# release.yml から呼ばれるほか、手動(workflow_dispatch)でも動かせる。成果物は artifact `windows-dist`。
name: Build Windows

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 配布物に入れる版(例 0.0.0-test)
        required: true
        default: 0.0.0-test
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # 版は package.json の packageManager
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: 画面のビルド(相対パス。Pages と同じ成果物)
        run: pnpm --filter @vvlog/desktop build
      - name: uv と ffmpeg を取得(同梱するもの)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools | Out-Null
          Invoke-WebRequest https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-pc-windows-msvc.zip -OutFile tools/uv.zip
          Expand-Archive tools/uv.zip tools/uv -Force
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip -OutFile tools/ffmpeg.zip
          Expand-Archive tools/ffmpeg.zip tools/ffmpeg -Force
          $uv = Get-ChildItem tools/uv -Recurse -Filter uv.exe | Select-Object -First 1
          $ff = Get-ChildItem tools/ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          "UV=$($uv.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "FFMPEG_DIR=$($ff.DirectoryName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          & $uv.FullName --version
          & $ff.FullName -version | Select-Object -First 1
      - name: 配布物の中身を並べて zip を作る
        run: python scripts/build_dist.py --version "${{ inputs.version }}" --spa apps/desktop/dist --uv "$env:UV" --ffmpeg-dir "$env:FFMPEG_DIR"
      - name: Inno Setup でインストーラーを作る
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue)?.Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ inputs.version }}" installer\vvlog.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
      - name: 中身の検査(インストーラーを静かに入れて、同梱物があることを確かめる)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist-win -Filter "*-windows-setup.exe" | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "vvlog-install"
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$dir" -Wait
          foreach ($f in "vvlog.cmd", "bin\uv.exe", "bin\ffmpeg.exe", "bin\ffprobe.exe", "spa\index.html", "server\vvlog_server\launcher.py", "pipeline\models\sam3", "weights\manifest.json", "server\bootstrap-spec.json",
                       "LICENSE", "NOTICE", "licenses\ffmpeg-LICENSE.txt", "licenses\uv-LICENSE-MIT", "licenses\uv-LICENSE-APACHE",
                       "pipeline\models\sam_3d_body\LICENSE") {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "同梱物がありません: $f" }
          }
          Get-ChildItem dist-win | Select-Object Name, @{n = "MB"; e = { [math]::Round($_.Length / 1MB, 1) } }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            dist-win/*-windows-setup.exe
            dist-win/*-windows-portable.zip
          if-no-files-found: error
