# main に push（develop → main のマージ）されたら、apps/desktop/package.json の version で release/vX.Y.Z ブランチと draft Release を作る。
# Tauri を廃止した（ADR-0015）ので、配布物（Windows インストーラー・ポータブル zip）のビルドと公開は #41（#34 のインストーラーができてから）。
# それまでは draft のまま残る（空のリリースを公開しない）。
# 同じ version のタグが既にあれば何もしない（version を上げていないマージでは配布しない）。
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=$(jq -r .version apps/desktop/package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version は作成済みなのでリリースしません"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: release ブランチ・タグ・draft Release
        if: steps.v.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          git push origin "HEAD:refs/heads/release/v$VERSION"
          gh release view "v$VERSION" >/dev/null 2>&1 ||
            gh release create "v$VERSION" --target "$GITHUB_SHA" --title "vvlog v$VERSION" --generate-notes --draft
