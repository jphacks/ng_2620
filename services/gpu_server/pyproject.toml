[project]
name = "vvlog-server"
version = "0.1.0"
description = "vvlog GPU server: jobs, uploads, artifacts and SSE over the inference pipeline"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "pydantic>=2.7,<3",
  "python-multipart>=0.0.9",
  "pyyaml>=6",
  "numpy>=1.24",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vvlog_server*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
